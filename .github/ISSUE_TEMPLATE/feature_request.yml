name: 功能建议
description: 想要一个新功能或改进
labels: [ enhancement ]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的不方便
      description: 先说场景，比直接说方案更有用
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望的解决方式
  - type: textarea
    id: alternatives
    attributes:
      label: 试过哪些替代办法
