name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build launcher + installers
        run: .\build.cmd

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BulesrtLauncher-2.0.0
          if-no-files-found: error
          path: |
            dist/launcher/BulesrtLauncher.exe
            dist/setup/BulesrtSetup.exe
            dist/setup-fresh/BulesrtSetup.exe
